{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>{% if is_internal %}内部客户录入{% else %}📋 上海净信 - 产品咨询登记{% endif %}</h4>
                {% if not is_internal %}
                <p class="mb-0">请填写以下信息，我们将安排专业人员与您对接</p>
                {% endif %}
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">公司/单位名称 <span class="text-danger">*</span></label>
                            <input type="text" name="company_name" class="form-control" required placeholder="例：XX大学/XX研究所">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">联系人 <span class="text-danger">*</span></label>
                            <input type="text" name="contact_name" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">手机号码 <span class="text-danger">*</span></label>
                            <input type="tel" name="phone" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" name="email" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">省份 <span class="text-danger">*</span></label>
                            <select name="province" class="form-select" required>
                                <option value="">请选择省份</option>
                                {% for p in provinces %}
                                <option value="{{ p }}">{{ p }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">城市</label>
                            <input type="text" name="city" class="form-control" placeholder="例：南京、杭州">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">了解渠道 <span class="text-danger">*</span></label>
                            <select name="channel" class="form-select" required>
                                <option value="">您从哪里了解到我们？</option>
                                {% for ch in channels %}
                                <option value="{{ ch }}">{{ ch }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">感兴趣的产品</label>
                            <input type="text" name="product_interest" class="form-control" placeholder="例：组织研磨仪、冷冻研磨仪">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">其他需求说明</label>
                        <textarea name="note" class="form-control" rows="3" placeholder="请描述您的具体需求..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        {% if is_internal %}录入客户{% else %}提交信息{% endif %}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
