{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card">
<div class="card-header"><b>修改密码</b></div>
<div class="card-body">
<form method="POST">
<div class="mb-3">
<label class="form-label">原密码</label>
<input type="password" name="old_password" class="form-control" required>
</div>
<div class="mb-3">
<label class="form-label">新密码</label>
<input type="password" name="new_password" class="form-control" required minlength="4">
</div>
<div class="mb-3">
<label class="form-label">确认新密码</label>
<input type="password" name="confirm_password" class="form-control" required minlength="4">
</div>
<button type="submit" class="btn btn-primary w-100">确认修改</button>
</form>
</div>
</div>
</div>
</div>
{% endblock %}
