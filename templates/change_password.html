{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card">
<div class="card-header"><b>修改密码</b></div>
<div class="card-body">
<form method="POST">
<div class="mb-3">
<label class="form-label">原密码</label>
<div class="position-relative">
<input type="password" name="old_password" id="old_password" class="form-control" required style="padding-right:40px;">
<span class="toggle-pwd" onclick="togglePassword('old_password', this)">👁️</span>
</div>
</div>
<div class="mb-3">
<label class="form-label">新密码</label>
<div class="position-relative">
<input type="password" name="new_password" id="new_password" class="form-control" required minlength="4" style="padding-right:40px;">
<span class="toggle-pwd" onclick="togglePassword('new_password', this)">👁️</span>
</div>
</div>
<div class="mb-3">
<label class="form-label">确认新密码</label>
<div class="position-relative">
<input type="password" name="confirm_password" id="confirm_password" class="form-control" required minlength="4" style="padding-right:40px;">
<span class="toggle-pwd" onclick="togglePassword('confirm_password', this)">👁️</span>
</div>
</div>
<button type="submit" class="btn btn-primary w-100">确认修改</button>
</form>
</div>
</div>
</div>
</div>

<style>
.toggle-pwd {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 16px;
    user-select: none;
    opacity: 0.5;
    transition: opacity 0.2s;
}
.toggle-pwd:hover {
    opacity: 1;
}
.toggle-pwd.active {
    opacity: 1;
}
</style>

<script>
function togglePassword(inputId, icon) {
    var input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🙈';
        icon.classList.add('active');
    } else {
        input.type = 'password';
        icon.textContent = '👁️';
        icon.classList.remove('active');
    }
}
</script>
{% endblock %}
