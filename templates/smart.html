{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8">

<!-- 文字粘贴解析 -->
<div class="card mb-3">
<div class="card-body py-2">
<div class="input-group">
<input type="text" id="rawText" class="form-control" placeholder="粘贴客户信息，例：丁香通 南京大学张伟13800001111咨询冷冻研磨仪">
<button class="btn" style="background:#43a047;color:#fff;border:none" onclick="parseText()">解析</button>
</div>
</div>
</div>

<!-- 图片识别区域 -->
<div class="card mb-3">
<div class="card-body py-2">
<div class="d-flex align-items-center gap-2 flex-wrap">
<label for="imageUpload" class="btn btn-outline-primary mb-0" style="font-size:14px;cursor:pointer;white-space:nowrap;">
📷 上传截图识别
</label>
<input type="file" id="imageUpload" accept="image/*" style="display:none" onchange="handleImageUpload(this)">
<button class="btn btn-outline-secondary mb-0" style="font-size:14px;" onclick="pasteFromClipboard()">📋 粘贴剪贴板图片</button>
<span id="ocrStatus" style="font-size:13px;color:#8f959e;margin-left:auto;"></span>
</div>
<div id="imagePreview" style="display:none;margin-top:10px;">
<div class="d-flex align-items-start gap-3">
<img id="previewImg" style="max-height:150px;max-width:300px;border-radius:8px;border:1px solid #dee0e3;">
<div class="flex-grow-1">
<label class="form-label">识别结果（可编辑后点解析）</label>
<textarea id="ocrResult" class="form-control" rows="3" style="font-size:13px;"></textarea>
<div class="mt-2 d-flex gap-2">
<button class="btn btn-sm" style="background:#43a047;color:#fff;border:none" onclick="useOcrResult()">使用此文字解析</button>
<button class="btn btn-sm btn-outline-secondary" onclick="clearImage()">清除</button>
</div>
</div>
</div>
</div>
<div id="ocrProgress" style="display:none;margin-top:10px;">
<div class="d-flex align-items-center gap-2">
<div class="spinner-border spinner-border-sm text-primary" role="status"></div>
<small id="ocrProgressText" style="color:#3370ff;">正在识别中...</small>
</div>
</div>
</div>
</div>

<!-- 客户信息表单 -->
<div class="card">
<div class="card-header"><b>客户信息</b></div>
<div class="card-body">
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}
<div class="alert alert-{{ 'success' if cat == 'success' else 'warning' if cat == 'warning' else 'danger' }} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
{% endfor %}{% endwith %}
<form method="POST">
<div class="row">
<div class="col-md-6 mb-2"><label class="form-label">公司/单位</label><input type="text" id="f_company" name="company_name" class="form-control"></div>
<div class="col-md-6 mb-2"><label class="form-label">联系人 <span class="text-danger">*</span></label><input type="text" id="f_name" name="contact_name" class="form-control" required></div>
</div>
<div class="row">
<div class="col-md-6 mb-2"><label class="form-label">电话 <span class="text-danger">*</span></label><input type="text" id="f_phone" name="phone" class="form-control" required></div>
<div class="col-md-6 mb-2"><label class="form-label">咨询产品</label><input type="text" id="f_product" name="product_interest" class="form-control"></div>
</div>
<div class="row">
<div class="col-md-3 mb-2"><label class="form-label">省份 <span class="text-danger">*</span></label><select id="f_province" name="province" class="form-select" required><option value="">请选择</option>{% for p in provinces %}<option value="{{ p }}">{{ p }}</option>{% endfor %}</select></div>
<div class="col-md-3 mb-2"><label class="form-label">城市</label><input type="text" id="f_city" name="city" class="form-control"></div>
<div class="col-md-3 mb-2"><label class="form-label">客户来源 <span class="text-danger">*</span></label><select id="f_channel" name="channel" class="form-select" required><option value="">请选择</option>{% for c in channels %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
<div class="col-md-3 mb-2"><label class="form-label">产品归属 <span class="text-danger">*</span></label><select id="f_dept" name="department" class="form-select" required>{% for d in departments %}<option value="{{ d }}">{{ d }}</option>{% endfor %}</select></div>
</div>
<div class="mb-2"><label class="form-label">备注</label><textarea id="f_note" name="note" class="form-control" rows="2"></textarea></div>
<input type="hidden" name="email" value="">
<button type="submit" class="btn btn-primary w-100 mt-2">确认录入</button>
</form>
</div>
</div>
</div>
</div>

<script>
// ==================== 图片识别功能（百度OCR） ====================

function handleImageUpload(input){
    if(input.files && input.files[0]){
        showPreview(input.files[0]);
        sendToOCR(input.files[0]);
    }
}

async function pasteFromClipboard(){
    try{
        var items = await navigator.clipboard.read();
        for(var item of items){
            for(var type of item.types){
                if(type.startsWith('image/')){
                    var blob = await item.getType(type);
                    var file = new File([blob], "clipboard.png", {type: type});
                    showPreview(file);
                    sendToOCR(file);
                    return;
                }
            }
        }
        alert("剪贴板中没有图片，请先截图");
    }catch(e){
        alert("无法访问剪贴板，请改用「上传截图识别」按钮");
    }
}

function showPreview(file){
    var reader = new FileReader();
    reader.onload = function(e){
        document.getElementById("previewImg").src = e.target.result;
        document.getElementById("imagePreview").style.display = "block";
        document.getElementById("ocrResult").value = "";
    };
    reader.readAsDataURL(file);
}

function sendToOCR(file){
    var progressDiv = document.getElementById("ocrProgress");
    var progressText = document.getElementById("ocrProgressText");
    var statusSpan = document.getElementById("ocrStatus");

    progressDiv.style.display = "block";
    statusSpan.innerHTML = '<span style="color:#3370ff;">⏳ 识别中...</span>';
    progressText.textContent = "正在识别文字，请稍候...";

    var formData = new FormData();
    formData.append("image", file);

    fetch("/ocr", {
        method: "POST",
        body: formData
    })
    .then(function(resp){ return resp.json(); })
    .then(function(data){
        progressDiv.style.display = "none";
        if(data.success){
            document.getElementById("ocrResult").value = data.text;
            statusSpan.innerHTML = '<span style="color:#34c724;">✅ 识别完成</span>';
        } else {
            statusSpan.innerHTML = '<span style="color:#f54a45;">❌ ' + (data.error || '识别失败') + '</span>';
        }
    })
    .catch(function(err){
        progressDiv.style.display = "none";
        statusSpan.innerHTML = '<span style="color:#f54a45;">❌ 网络错误</span>';
        console.error("OCR Error:", err);
    });
}

function useOcrResult(){
    var text = document.getElementById("ocrResult").value.trim();
    if(!text){ alert("没有识别到文字"); return; }
    document.getElementById("rawText").value = text;
    parseText();
}

function clearImage(){
    document.getElementById("imagePreview").style.display = "none";
    document.getElementById("ocrProgress").style.display = "none";
    document.getElementById("ocrStatus").innerHTML = "";
    document.getElementById("imageUpload").value = "";
    document.getElementById("ocrResult").value = "";
}

// Ctrl+V 直接粘贴图片
document.addEventListener('paste', function(e){
    var items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for(var i=0; i<items.length; i++){
        if(items[i].type.indexOf('image') !== -1){
            var blob = items[i].getAsFile();
            showPreview(blob);
            sendToOCR(blob);
            e.preventDefault();
            return;
        }
    }
});

// ==================== 文字解析功能 ====================

function parseText(){
    var t = document.getElementById("rawText").value;
    if(!t.trim()) return;
    document.getElementById("f_company").value = "";
    document.getElementById("f_name").value = "";
    document.getElementById("f_phone").value = "";
    document.getElementById("f_product").value = "";
    document.getElementById("f_city").value = "";
    document.getElementById("f_province").selectedIndex = 0;
    document.getElementById("f_channel").selectedIndex = 0;
    document.getElementById("f_dept").selectedIndex = 0;
    var surnames = "赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳鲍史唐费廉岑薛雷贺倪汤滕殷罗毕郝邬安常乐于时傅皮卞齐康伍余元卜顾孟平黄和穆萧尹姚邵湛汪祁毛禹狄米贝明臧计伏成戴谈宋茅庞熊纪舒屈项祝董梁杜阮蓝闵席季麻强贾路娄危江童颜郭梅盛林刁钟徐邱骆高夏蔡田樊胡凌霍虞万支柯管卢莫经房裘缪干解应宗丁宣邓郁单杭洪包诸左石崔吉龚程邢裴陆荣翁荀羊惠甄曲家封储靳汲邴松井段富巫乌焦巴弓牧山谷车侯蓬全班仰秋仲伊宫宁仇栾暴甘戎祖武符刘景詹束龙叶幸司韶郜黎蓟薄印宿白怀蒲邰从鄂索咸赖卓蔺屠蒙池乔阴胥能苍双闻莘党翟谭贡劳逄姬申扶堵冉宰郦雍璩桑寿通边燕冀郏浦尚农温别庄晏柴瞿阎充慕连茹习宦艾鱼容向古易慎戈廖庾终暨居衡步都耿满弘匡国文寇广禄阙东欧殳沃利蔚越夔隆师巩厍聂晁勾敖融冷訾辛阚那简饶空曾母沙乜养鞠须丰巢关蒯相查后荆红游竺权逯盖益桓公仉督岳帅缑亢况后有琴";
    var parts = t.split(/[\s,，、;；\t]+/).filter(function(p){return p.trim()!="";});

    // ===== 1. PHONE =====
    var phoneMatch = t.match(/1[3-9]\d{9}/);
    if(phoneMatch) document.getElementById("f_phone").value = phoneMatch[0];

    // ===== 2. PRODUCT =====
    var dept2Products = ["真空离心浓缩仪","单细胞悬液制备仪","超声波DNA打断仪","真空搅拌脱泡机","高压均质机","单细胞悬液","离心浓缩","高压均质","真空搅拌","DNA打断","脱泡机","浓缩仪","均质机"];
    var ibidiProducts = ["通道载玻片","活细胞成像","细胞培养","细胞迁移","血管生成","伤口愈合","载玻片","培养皿","ibidi","IBIDI","Ibidi","灌流","趋化"];
    var dept1Products = ["实验室转动筛","实验室振动筛","实验室旋转筛","实验室研磨仪","多样品研磨仪","高通量研磨仪","振动研磨仪","行星式研磨仪","刀式研磨仪","臼式研磨仪","盘式研磨仪","颚式破碎仪","切割研磨仪","冷冻研磨仪","组织研磨仪","土壤研磨仪","细胞破碎仪","冷冻研磨","组织研磨","土壤研磨","液氮研磨","多样品研磨","高通量研磨","行星球磨","振动球磨","刀式研磨","臼式研磨","盘式研磨","颚式破碎","切割研磨","三维振动","实验室筛","转动筛","振动筛","旋转筛","实验筛","标准筛","分析筛","研磨仪","研磨机","粉碎机","粉碎仪","均质器","均质仪","混合仪","筛分仪","球磨仪","球磨机","匀浆机","匀浆仪"];
    var foundProducts = [];
    var detectedDept = "";
    var productParts = [];
    function isSubOf(short, list){
        for(var i=0;i<list.length;i++){
            if(list[i] != short && list[i].indexOf(short)>=0) return true;
        }
        return false;
    }
    function matchProducts(prodList, deptName){
        for(var i=0;i<prodList.length;i++){
            var p = prodList[i];
            var searchText = (deptName=="ibidi") ? t.toLowerCase() : t;
            var searchProd = (deptName=="ibidi") ? p.toLowerCase() : p;
            if(searchText.indexOf(searchProd)>=0){
                if(!isSubOf(p, foundProducts)){
                    foundProducts.push(p);
                    productParts.push(p);
                    if(!detectedDept) detectedDept = deptName;
                }
            }
        }
    }
    matchProducts(ibidiProducts, "ibidi");
    matchProducts(dept2Products, "线下二部");
    matchProducts(dept1Products, "线下一部");
    var productKeywords = ["研磨","粉碎","均质","筛分","球磨","匀浆","破碎","振动","转动","旋转","离心","浓缩","打断","脱泡","搅拌","培养","载玻","灌流","成像","趋化","愈合","迁移"];
    for(var i=0;i<parts.length;i++){
        var p = parts[i];
        if(/\d/.test(p)) continue;
        if(p.length < 2) continue;
        var isProduct = false;
        for(var j=0;j<productKeywords.length;j++){
            if(p.indexOf(productKeywords[j])>=0){isProduct=true;break;}
        }
        if(p.indexOf("实验室")>=0 || (p.indexOf("实验")>=0 && p.length>2)) isProduct = true;
        if(isProduct){
            productParts.push(p);
            var dominated = false;
            for(var k=0;k<foundProducts.length;k++){
                if(foundProducts[k].indexOf(p)>=0 || p.indexOf(foundProducts[k])>=0){dominated=true;break;}
            }
            if(!dominated) foundProducts.push(p);
            if(!detectedDept) detectedDept = "线下一部";
        }
    }
    var finalProducts = [];
    for(var i=0;i<foundProducts.length;i++){
        var dominated = false;
        for(var j=0;j<foundProducts.length;j++){
            if(i!=j && foundProducts[j].indexOf(foundProducts[i])>=0 && foundProducts[j].length>foundProducts[i].length){
                dominated = true;break;
            }
        }
        if(!dominated) finalProducts.push(foundProducts[i]);
    }
    if(finalProducts.length>0){
        document.getElementById("f_product").value = finalProducts.join("、");
    }
    if(detectedDept){
        var selDept = document.getElementById("f_dept");
        for(var i=0;i<selDept.options.length;i++){
            if(selDept.options[i].value==detectedDept){selDept.selectedIndex=i;break;}
        }
    }

    // ===== 3. COMPANY =====
    var foundCompany = "";
    var orgPatterns = [
        /([\u4e00-\u9fa5]{2,}(?:大学|学院|研究所|研究院|公司|医院|中心|集团|实验室|药业|生物|科技|工业|制药|食品|农业|环保|检测|化工|材料|电子|机械|能源|矿业|地质|水利|林业|畜牧|水产|制造|纺织|冶金|建筑|设计院|疾控|防疫|质检|海关|监测站)[\u4e00-\u9fa5]{0,8})/,
        /([\u4e00-\u9fa5]{2,}(?:有限公司|股份公司|责任公司))/
    ];
    for(var i=0;i<orgPatterns.length;i++){
        var m = t.match(orgPatterns[i]);
        if(m){foundCompany=m[1];document.getElementById("f_company").value=m[1];break;}
    }

    // ===== 4. CONTACT NAME（增强版） =====
    var foundName = "";
    var titleSuffixes = ["女士","先生","老师","教授","博士","主任","院长","所长","工程师","经理","总监","总","处长","科长","部长","组长","队长","厂长","书记","医生","护士","师傅"];

    function isNotName(text){
        if(!text) return true;
        for(var i=0;i<productParts.length;i++){
            if(productParts[i].indexOf(text)>=0||text.indexOf(productParts[i])>=0) return true;
        }
        var badWords = ["实验","研磨","粉碎","均质","筛分","球磨","匀浆","破碎","振动","转动","旋转","冷冻","离心","浓缩","打断","脱泡","搅拌","培养","载玻","灌流","成像","趋化","筛","磨","仪","机","室","咨询","了解","需要","想要","购买","采购","询价","报价","经销商","经销","客户","也在","尽快","联系","悬液","制备","单细胞","真空","超声","高压","高通量"];
        for(var i=0;i<badWords.length;i++){
            if(text.indexOf(badWords[i])>=0) return true;
        }
        var places = ["上海","北京","天津","重庆","江苏","浙江","广东","山东","河北","河南","湖北","湖南","四川","福建","安徽","辽宁","江西","陕西","山西","广西","云南","贵州","吉林","黑龙江","甘肃","海南","内蒙古","新疆","西藏","青海","宁夏","港澳台","大庆","南京","苏州","杭州","广州","深圳","武汉","成都","西安","长沙","郑州","济南","青岛","福州","厦门","合肥","昆明","太原","兰州","海口","银川","拉萨","西宁"];
        for(var i=0;i<places.length;i++){if(text==places[i]) return true;}
        var channels = ["丁香通","仪器信息网","拓赫化工","微信","电询","来电","净信商桥","拓赫商桥","雷萌商桥","测博商桥","拓赫电询","QQ","qq"];
        for(var i=0;i<channels.length;i++){if(text==channels[i]||text.indexOf(channels[i])>=0) return true;}
        if(foundCompany && foundCompany.indexOf(text)>=0) return true;
        return false;
    }

    // 方法A：匹配"姓+称呼"格式，如"朱女士"、"张先生"、"李老师"
    for(var i=0;i<titleSuffixes.length;i++){
        var suffix = titleSuffixes[i];
        var reg = new RegExp("([\\u4e00-\\u9fa5]{1,2})" + suffix);
        var m = t.match(reg);
        if(m){
            var namePart = m[1];
            if(surnames.indexOf(namePart[0])>=0 && !isNotName(namePart)){
                foundName = m[0]; // 包含称呼，如"朱女士"
                break;
            }
        }
    }

    // 方法B：空格分隔的词中找2-3字姓名
    if(!foundName){
        for(var i=0;i<parts.length;i++){
            var p = parts[i].trim();
            if(/\d/.test(p)) continue;
            if(p.length>4) continue;
            // 先检查这个词是否包含称呼
            var hasTitle = false;
            for(var ti=0;ti<titleSuffixes.length;ti++){
                if(p.indexOf(titleSuffixes[ti])>=0){
                    var beforeTitle = p.replace(titleSuffixes[ti],"");
                    if(beforeTitle.length>=1 && beforeTitle.length<=2 && surnames.indexOf(beforeTitle[0])>=0 && !isNotName(beforeTitle)){
                        foundName = p;
                        hasTitle = true;
                        break;
                    }
                }
            }
            if(hasTitle) break;
            if(p.length==1 && surnames.indexOf(p)>=0){
                foundName = p;
                break;
            }
            if(p.length>=2 && p.length<=3 && /^[\u4e00-\u9fa5]+$/.test(p)){
                if(surnames.indexOf(p[0])>=0 && !isNotName(p)){
                    foundName = p;
                    break;
                }
            }
        }
    }

    // 方法C：正则匹配"我是/我叫"
    if(!foundName){
        var m1 = t.match(/我(?:是|叫)([\u4e00-\u9fa5]{2,3})/);
        if(m1 && !isNotName(m1[1])) foundName = m1[1];
    }

    // 方法D：正则匹配"姓名+职位"
    if(!foundName){
        var m2 = t.match(/([\u4e00-\u9fa5]{2,3})(?:老师|教授|博士|主任|院长|所长|工程师|经理|总)/);
        if(m2 && !isNotName(m2[1])) foundName = m2[1];
    }

    // 方法E：正则匹配"联系人：xxx"
    if(!foundName){
        var m3 = t.match(/(?:联系人|姓名|客户|名字)[：:\s]*([\u4e00-\u9fa5]{2,3})/);
        if(m3 && !isNotName(m3[1])) foundName = m3[1];
    }

    // 方法F：从连续文本中提取"姓+女士/先生"
    if(!foundName){
        var titleReg = /([\u4e00-\u9fa5])(?:女士|先生|老师)/g;
        var tm;
        while((tm = titleReg.exec(t)) !== null){
            if(surnames.indexOf(tm[1])>=0){
                foundName = tm[0];
                break;
            }
        }
    }

    if(foundName) document.getElementById("f_name").value = foundName;

    // ===== 5. CITY TO PROVINCE =====
    var cityMap = {
        "北京":"北京","上海":"上海","天津":"天津","重庆":"重庆",
