{% extends "base.html" %}
{% block content %}
<h3 class="mb-4">智能录入（粘贴聊天记录自动解析）</h3>
<div class="row">
<div class="col-md-6">
<div class="card">
<div class="card-header bg-primary text-white"><b>粘贴客户信息</b></div>
<div class="card-body">
<p class="text-muted">把客户的聊天记录、名片信息等粘贴到下面，点击解析</p>
<textarea id="rawText" class="form-control" rows="6" placeholder="例：你好，我是南京大学的张伟，电话13800001111，想咨询冷冻研磨仪"></textarea>
<button class="btn btn-success w-100 mt-3" onclick="parseText()">智能解析</button>
<div class="mt-3">
<small class="text-muted">支持识别：手机号、公司/大学名称、联系人姓名、产品名称、城市自动匹配省份</small>
</div>
</div></div>
<div class="card mt-3">
<div class="card-header bg-info text-white"><b>使用示例</b></div>
<div class="card-body">
<p class="mb-2"><small class="text-muted">以下内容都能自动解析：</small></p>
<div class="bg-light p-2 rounded mb-2"><small>你好，我是南京大学的张伟，电话13800001111，想咨询冷冻研磨仪</small></div>
<div class="bg-light p-2 rounded mb-2"><small>武汉理工大学 李老师 15900002222 需要组织研磨仪</small></div>
<div class="bg-light p-2 rounded mb-2"><small>浙江大学化学系王教授来电咨询土壤研磨机，手机：13700003333</small></div>
</div></div>
</div>
<div class="col-md-6">
<div class="card">
<div class="card-header bg-success text-white"><b>解析结果（可修改后提交）</b></div>
<div class="card-body">
<form method="POST">
<div class="mb-2"><label class="form-label">公司/单位</label><input type="text" id="f_company" name="company_name" class="form-control"></div>
<div class="mb-2"><label class="form-label">联系人 <span class="text-danger">*</span></label><input type="text" id="f_name" name="contact_name" class="form-control" required></div>
<div class="mb-2"><label class="form-label">电话 <span class="text-danger">*</span></label><input type="text" id="f_phone" name="phone" class="form-control" required></div>
<div class="mb-2"><label class="form-label">邮箱</label><input type="text" id="f_email" name="email" class="form-control"></div>
<div class="row">
<div class="col-md-6 mb-2"><label class="form-label">省份 <span class="text-danger">*</span></label><select id="f_province" name="province" class="form-select" required><option value="">请选择</option>{% for p in provinces %}<option value="{{ p }}">{{ p }}</option>{% endfor %}</select></div>
<div class="col-md-6 mb-2"><label class="form-label">城市</label><input type="text" id="f_city" name="city" class="form-control"></div>
</div>
<div class="mb-2"><label class="form-label">渠道 <span class="text-danger">*</span></label><select name="channel" class="form-select" required><option value="">请选择</option>{% for c in channels %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
<div class="mb-2"><label class="form-label">感兴趣产品</label><input type="text" id="f_product" name="product_interest" class="form-control"></div>
<div class="mb-2"><label class="form-label">备注</label><textarea id="f_note" name="note" class="form-control" rows="2"></textarea></div>
<button type="submit" class="btn btn-primary w-100 mt-2">确认录入</button>
</form>
</div></div>
</div>
</div>

<script>
function parseText(){
    var t = document.getElementById("rawText").value;
    if(!t.trim()){alert("请先粘贴客户信息");return;}

    // extract phone number
    var phoneMatch = t.match(/1[3-9]\d{9}/);
    if(phoneMatch) document.getElementById("f_phone").value = phoneMatch[0];

    // extract email
    var emailMatch = t.match(/[\w.-]+@[\w.-]+\.\w+/);
    if(emailMatch) document.getElementById("f_email").value = emailMatch[0];

    // extract company/university/institute
    var orgPatterns = [
        /([\u4e00-\u9fa5]{2,}(?:大学|学院|研究所|研究院|公司|医院|中心|集团|实验室|药业|生物|科技|工业|制药|食品|农业|环保|检测|化工|材料)[\u4e00-\u9fa5]{0,6})/,
        /([\u4e00-\u9fa5]{2,}(?:有限公司|股份公司|责任公司))/
    ];
    for(var i=0;i<orgPatterns.length;i++){
        var m = t.match(orgPatterns[i]);
        if(m){document.getElementById("f_company").value = m[1];break;}
    }

    // extract product interest
    var products = ["冷冻研磨仪","组织研磨仪","土壤研磨仪","研磨仪","研磨机","粉碎机","粉碎仪","均质器","均质仪","混合仪","筛分仪","冷冻研磨","组织研磨","土壤研磨","球磨仪","球磨机","超声波","匀浆机","匀浆仪","细胞破碎","样品前处理"];
    var foundProducts = [];
    for(var i=0;i<products.length;i++){
        if(t.indexOf(products[i])>=0) foundProducts.push(products[i]);
    }
    if(foundProducts.length>0) document.getElementById("f_product").value = foundProducts.join("、");

    // extract contact name
    var namePatterns = [
        /我(?:是|叫)[\u4e00-\u9fa5]*?(?:的)?([\u4e00-\u9fa5]{2,3})[\uff0c,\s]/,
        /([\u4e00-\u9fa5]{2,3})(?:老师|教授|博士|主任|院长|所长|工程师|工)/,
        /(?:联系人|姓名|客户)[：:\s]*([\u4e00-\u9fa5]{2,3})/,
        /(?:找|问|咨询|来电)[：:\s]*([\u4e00-\u9fa5]{2,3})/
    ];
    for(var i=0;i<namePatterns.length;i++){
        var m = t.match(namePatterns[i]);
        if(m){document.getElementById("f_name").value = m[1];break;}
    }

    // city to province mapping
    var cityMap = {
        "北京":"北京","上海":"上海","天津":"天津","重庆":"重庆",
        "南京":"江苏","苏州":"江苏","无锡":"江苏","常州":"江苏","徐州":"江苏","南通":"江苏","扬州":"江苏","镇江":"江苏","盐城":"江苏","淮安":"江苏","连云港":"江苏","泰州":"江苏","宿迁":"江苏",
        "杭州":"浙江","宁波":"浙江","温州":"浙江","嘉兴":"浙江","湖州":"浙江","绍兴":"浙江","金华":"浙江","台州":"浙江",
        "广州":"广东","深圳":"广东","东莞":"广东","佛山":"广东","珠海":"广东","惠州":"广东","中山":"广东","汕头":"广东",
        "济南":"山东","青岛":"山东","烟台":"山东","潍坊":"山东","威海":"山东","临沂":"山东","淄博":"山东",
        "成都":"四川","绵阳":"四川","德阳":"四川","乐山":"四川",
        "武汉":"湖北","宜昌":"湖北","襄阳":"湖北",
        "长沙":"湖南","株洲":"湖南","湘潭":"湖南",
        "郑州":"河南","洛阳":"河南","开封":"河南","新乡":"河南",
        "西安":"陕西","咸阳":"陕西","宝鸡":"陕西",
        "沈阳":"辽宁","大连":"辽宁","鞍山":"辽宁",
        "哈尔滨":"黑龙江","大庆":"黑龙江","齐齐哈尔":"黑龙江",
        "长春":"吉林","吉林市":"吉林",
        "福州":"福建","厦门":"福建","泉州":"福建",
        "南昌":"江西","九江":"江西","赣州":"江西",
        "合肥":"安徽","芜湖":"安徽","蚌埠":"安徽","马鞍山":"安徽",
        "昆明":"云南","大理":"云南",
        "贵阳":"贵州","遵义":"贵州",
        "兰州":"甘肃","天水":"甘肃",
        "太原":"山西","大同":"山西",
        "石家庄":"河北","唐山":"河北","保定":"河北","邯郸":"河北",
        "南宁":"广西","桂林":"广西","柳州":"广西",
        "海口":"海南","三亚":"海南",
        "呼和浩特":"内蒙古","包头":"内蒙古",
        "乌鲁木齐":"新疆","克拉玛依":"新疆",
        "拉萨":"西藏",
        "西宁":"青海",
        "银川":"宁夏"
    };

    var foundCity = "";
    var foundProvince = "";
    for(var city in cityMap){
        if(t.indexOf(city)>=0){
            foundCity = city;
            foundProvince = cityMap[city];
            break;
        }
    }

    // also check province names directly
    if(!foundProvince){
        var provList = ["上海","北京","天津","重庆","江苏","浙江","广东","山东","河北","河南","湖北","湖南","四川","福建","安徽","辽宁","江西","陕西","山西","广西","云南","贵州","吉林","黑龙江","甘肃","海南","内蒙古","新疆","西藏","青海","宁夏"];
        for(var i=0;i<provList.length;i++){
            if(t.indexOf(provList[i])>=0){foundProvince = provList[i];break;}
        }
    }

    if(foundCity) document.getElementById("f_city").value = foundCity;
    if(foundProvince){
        var sel = document.getElementById("f_province");
        for(var i=0;i<sel.options.length;i++){
            if(sel.options[i].value == foundProvince){sel.selectedIndex = i;break;}
        }
    }

    // put original text in note
    document.getElementById("f_note").value = t;

    // show result
    var results = [];
    if(document.getElementById("f_company").value) results.push("公司：" + document.getElementById("f_company").value);
    if(document.getElementById("f_name").value) results.push("姓名：" + document.getElementById("f_name").value);
    if(document.getElementById("f_phone").value) results.push("电话：" + document.getElementById("f_phone").value);
    if(foundProvince) results.push("省份：" + foundProvince);
    if(document.getElementById("f_product").value) results.push("产品：" + document.getElementById("f_product").value);

    if(results.length > 0){
        alert("解析成功！识别到：\n" + results.join("\n") + "\n\n请检查右边结果，选择渠道后点确认录入");
    } else {
        alert("未能自动识别，请手动填写右边的表单");
    }
}
</script>
{% endblock %}
