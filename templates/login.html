<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>登录 - 上海净信CRM</title>
<link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<style>
*{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
body{background:#f5f6f7;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:40px 36px}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo img{height:48px;width:auto}
.login-title{text-align:center;font-size:18px;font-weight:600;color:#1f2329;margin-bottom:24px}
.form-control{border:1px solid #dee0e3;border-radius:8px;font-size:14px;padding:10px 14px}
.form-control:focus{border-color:#3370ff;box-shadow:0 0 0 2px rgba(51,112,255,0.1)}
.btn-login{background:#3370ff;border:none;border-radius:8px;font-size:15px;padding:10px;font-weight:500;width:100%}
.btn-login:hover{background:#245bdb}
.alert{border-radius:8px;font-size:14px;border:none}
.alert-success{background:#f0fff0;color:#1a8917}
.alert-warning{background:#fff8f0;color:#d4760a}
.alert-danger{background:#fff0f0;color:#d83931}
</style>
</head>
<body>
<div class="login-card">
<div class="login-logo">
<img src="{{ url_for('static', filename='logo.png') }}" alt="净信">
</div>
<div class="login-title">客户管理系统</div>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}
<div class="alert alert-{{ 'success' if cat == 'success' else 'warning' if cat == 'warning' else 'danger' }} alert-dismissible fade show mb-3">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
{% endfor %}{% endwith %}
<form method="POST">
<div class="mb-3">
<input type="text" name="username" class="form-control" placeholder="用户名" required autofocus>
</div>
<div class="mb-3">
<input type="password" name="password" class="form-control" placeholder="密码" required>
</div>
<button type="submit" class="btn btn-primary btn-login">登 录</button>
</form>
</div>
<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body></html>
