<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>上海净信 - 产品咨询</title>
<link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f0f4f8}
.header{background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;padding:30px 0;text-align:center}
</style>
</head>
<body>
<div class="header">
<h2>上海净信实业发展有限公司</h2>
<p class="mb-0">产品咨询登记</p>
</div>
<div class="container mt-4">
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}
<div class="alert alert-{{ 'success' if cat == 'success' else 'danger' }} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
{% endfor %}{% endwith %}
<div class="row justify-content-center">
<div class="col-md-8">
<div class="card shadow mt-3">
<div class="card-body p-4">
<p class="text-muted text-center">请填写以下信息，我们将安排专业人员与您对接</p>
<form method="POST">
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">公司/单位名称 <span class="text-danger">*</span></label><input type="text" name="company_name" class="form-control" required placeholder="例：XX大学"></div>
<div class="col-md-6 mb-3"><label class="form-label">联系人 <span class="text-danger">*</span></label><input type="text" name="contact_name" class="form-control" required></div></div>
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">手机号 <span class="text-danger">*</span></label><input type="tel" name="phone" class="form-control" required></div>
<div class="col-md-6 mb-3"><label class="form-label">邮箱</label><input type="email" name="email" class="form-control"></div></div>
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">省份 <span class="text-danger">*</span></label><select name="province" class="form-select" required><option value="">请选择</option>{% for p in provinces %}<option value="{{ p }}">{{ p }}</option>{% endfor %}</select></div>
<div class="col-md-6 mb-3"><label class="form-label">城市</label><input type="text" name="city" class="form-control"></div></div>
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">了解渠道 <span class="text-danger">*</span></label><select name="channel" class="form-select" required><option value="">请选择</option>{% for c in channels %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
<div class="col-md-6 mb-3"><label class="form-label">感兴趣的产品</label><input type="text" name="product_interest" class="form-control" placeholder="例：组织研磨仪"></div></div>
<div class="mb-3"><label class="form-label">备注</label><textarea name="note" class="form-control" rows="3"></textarea></div>
<button type="submit" class="btn btn-primary btn-lg w-100">提交信息</button>
</form>
</div></div>
<p class="text-center text-muted mt-3">上海净信实业发展有限公司</p>
</div></div></div>
<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body></html>
